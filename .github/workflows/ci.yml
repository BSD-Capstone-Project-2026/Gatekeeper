name: CI

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: security
            marker: security
          - group: access
            marker: access
          - group: visitors
            marker: visitors
          - group: desk
            marker: desk
          - group: interface and other
            marker: not (security or access or visitors or desk)
    defaults:
      run:
        working-directory: secure-access-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: secure-access-system/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -n auto -m "${{ matrix.marker }}"
