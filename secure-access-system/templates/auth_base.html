{% extends "base.html" %}

{% block content %}
<main class="auth-page">
    <div class="card auth-card">
        <div class="card-body">
            <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
            <h1 class="auth-title">{% block heading %}{% endblock %}</h1>
            <p class="text-muted text-center mb-4">{% block subheading %}{% endblock %}</p>
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert alert-success" role="alert">{{ success }}</div>
            {% endif %}
            {% block form %}{% endblock %}
        </div>
    </div>
</main>
{% endblock %}
