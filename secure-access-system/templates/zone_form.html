{% extends "app_base.html" %}
{% block title %}{{ 'Edit' if zone else 'New' }} Zone - Gatekeeper{% endblock %}
{% block heading %}{{ 'Edit' if zone else 'New' }} Zone{% endblock %}
{% block description %}Zones control which doors people can open.{% endblock %}

{% block body %}
<div class="card account-card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ zone.name if zone else '' }}" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="3">{{ zone.description if zone else '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Zone</button>
            <a href="{{ url_for('web.list_zones') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
